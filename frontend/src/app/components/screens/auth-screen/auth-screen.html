<div class="flex-1 flex items-center justify-center p-6">
  <div
    class="w-full max-w-sm bg-card border border-border rounded-sm p-6 shadow-sm flex flex-col gap-6"
  >
    <div class="flex flex-col gap-1.5 text-center">
      <h2 class="text-xl font-semibold tracking-tight text-foreground">
        {{ isSignUp() ? 'Create an account' : 'Welcome back' }}
      </h2>
      <p class="text-xs text-muted-foreground">
        {{
          isSignUp()
            ? 'Enter your details below to create your account'
            : 'Enter your email and password to sign in'
        }}
      </p>
    </div>

    <form class="flex flex-col gap-4" (submit)="$event.preventDefault()">
      <div class="flex flex-col gap-1.5">
        <label for="email" class="text-xs font-medium text-foreground">Email</label>
        <input
          id="email"
          type="email"
          placeholder="name@example.com"
          autocomplete="email"
          class="w-full px-3 py-1.5 text-sm bg-muted rounded-sm border border-transparent focus:outline-none focus:ring-1 focus:ring-ring placeholder:text-muted-foreground transition-colors"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label for="password" class="text-xs font-medium text-foreground">Password</label>
        </div>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          class="w-full px-3 py-1.5 text-sm bg-muted rounded-sm border border-transparent focus:outline-none focus:ring-1 focus:ring-ring placeholder:text-muted-foreground transition-colors"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label for="repeat-password" class="text-xs font-medium text-foreground"
            >Repeat Password</label
          >
        </div>
        <input
          id="repeat-password"
          type="password"
          placeholder="••••••••"
          class="w-full px-3 py-1.5 text-sm bg-muted rounded-sm border border-transparent focus:outline-none focus:ring-1 focus:ring-ring placeholder:text-muted-foreground transition-colors"
        />
      </div>

      <button
        type="submit"
        class="w-full mt-2 py-2 px-4 bg-primary text-primary-foreground text-sm font-medium rounded-sm hover:opacity-90 transition-opacity cursor-pointer"
      >
        {{ isSignUp() ? 'Sign Up' : 'Sign In' }}
      </button>
    </form>

    <div class="text-center text-xs text-muted-foreground">
      <span>{{ isSignUp() ? 'Already have an account?' : "Don't have an account?" }}</span>
      <button
        type="button"
        (click)="toggleMode()"
        class="ml-1 text-foreground underline underline-offset-4 hover:opacity-80 transition-opacity cursor-pointer"
      >
        {{ isSignUp() ? 'Sign in' : 'Sign up' }}
      </button>
    </div>
  </div>
</div>
