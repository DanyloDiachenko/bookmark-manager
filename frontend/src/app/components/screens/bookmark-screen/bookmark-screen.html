<div class="flex-1 overflow-y-auto px-7 py-6">
  <div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
    @if (isLoading()) {
      @for (_ of [1, 2, 3, 4, 5, 6]; track _) {
        <div
          class="border border-border rounded-sm p-4 bg-card flex flex-col gap-3 animate-pulse"
        >
          <!-- Top row: favicon + domain -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 flex-1">
              <div class="w-4 h-4 rounded-sm bg-muted shrink-0"></div>
              <div class="h-3 w-32 bg-muted rounded-sm"></div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <div class="w-3.5 h-3.5 rounded-sm bg-muted"></div>
              <div class="w-3.5 h-3.5 rounded-sm bg-muted"></div>
            </div>
          </div>

          <!-- Middle: title + description -->
          <div class="flex flex-col gap-2 my-1">
            <div class="h-4 w-3/4 bg-muted rounded-sm"></div>
            <div class="h-3 w-full bg-muted/60 rounded-sm"></div>
            <div class="h-3 w-2/3 bg-muted/60 rounded-sm"></div>
          </div>

          <!-- Bottom: tags & folder -->
          <div class="flex items-center gap-1.5 mt-auto pt-1">
            <div class="h-4 w-12 bg-muted rounded-sm"></div>
            <div class="h-4 w-14 bg-muted rounded-sm"></div>
            <div class="h-3 w-16 bg-muted rounded-sm ml-auto"></div>
          </div>
        </div>
      }
    } @else if (bookmarks().length > 0) {
      @for (bookmark of bookmarks(); track bookmark.id) {
        <app-bookmark [bookmark]="bookmark" />
      }
    } @else {
      <p class="text-sm text-muted-foreground col-span-full">You don't have any bookmarks yet.</p>
    }
  </div>
</div>
