<div
  class="group border border-border rounded-sm p-4 bg-card hover:shadow-sm transition-shadow relative flex flex-col gap-3"
  bis_skin_checked="1"
>
  <div class="flex items-center justify-between" bis_skin_checked="1">
    <div class="flex items-center gap-2 min-w-0" bis_skin_checked="1">
      <img
        src="https://www.google.com/s2/favicons?domain=refactoringui.com&amp;sz=32"
        alt=""
        class="w-4 h-4 rounded-sm shrink-0"
      /><span
        class="text-[11px] text-muted-foreground truncate"
        style="font-family: 'JetBrains Mono', monospace"
        >{{ bookmark().url }}</span
      >
    </div>
    <div
      class="flex items-center gap-0.5 transition-opacity shrink-0 ml-2 opacity-0 group-hover:opacity-100"
    >
      <button
        aria-label="Favourite bookmark"
        class="p-1 rounded-sm hover:bg-accent transition-colors text-amber-500 text-amber-500"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="currentColor"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="lucide lucide-star w-3.5 h-3.5"
        >
          <path
            d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
          ></path>
        </svg></button
      ><button
        aria-label="Read later"
        class="p-1 rounded-sm hover:bg-accent transition-colors text-muted-foreground hover:text-foreground text-blue-500"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="lucide lucide-clock w-3.5 h-3.5"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg></button
      ><a
        href="https://refactoringui.com"
        target="_blank"
        rel="noreferrer"
        aria-label="Open bookmark in new tab"
        class="p-1 rounded-sm hover:bg-accent text-muted-foreground hover:text-foreground transition-colors"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="lucide lucide-external-link w-3.5 h-3.5"
        >
          <path d="M15 3h6v6"></path>
          <path d="M10 14 21 3"></path>
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a
      ><button
        aria-label="Delete bookmark"
        class="p-1 rounded-sm hover:bg-accent transition-colors text-muted-foreground hover:text-foreground hover:text-destructive"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="lucide lucide-trash2 lucide-trash-2 w-3.5 h-3.5"
        >
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          <line x1="10" x2="10" y1="11" y2="17"></line>
          <line x1="14" x2="14" y1="11" y2="17"></line>
        </svg>
      </button>
    </div>
  </div>
  <div bis_skin_checked="1">
    <h3 class="text-sm font-semibold text-foreground leading-snug line-clamp-2">
      {{ bookmark().title }}
    </h3>
    <p class="text-xs text-muted-foreground mt-1 leading-relaxed line-clamp-2">
      {{ bookmark().description }}
    </p>
  </div>
  <div class="flex items-center gap-1 flex-wrap mt-auto" bis_skin_checked="1">
    @for (tag of bookmark().tags; track tag.id) {
      <span
        class="text-[10px] px-1.5 py-0.5 bg-muted text-muted-foreground rounded-sm"
        style="font-family: 'JetBrains Mono', monospace"
        >{{ tag.title }}</span
      >
    }
    @if (bookmark().folder; as folder) {
      <span
        class="ml-auto text-[10px] font-medium"
        [style.color]="folder.color"
        style="font-family: 'JetBrains Mono', monospace"
        >{{ folder.title }}</span
      >
    }
  </div>
</div>
