@if (isOpen()) {
  <div
    class="fixed inset-0 bg-black/40 z-40 xs:hidden backdrop-blur-xs transition-opacity duration-300"
    (click)="close()"
    aria-hidden="true"
  ></div>
}

<aside
  class="fixed inset-y-0 left-0 z-50 w-64 max-w-[85vw] h-screen flex flex-col border-r border-border bg-secondary shadow-2xl transition-transform duration-300 ease-in-out xs:static xs:translate-x-0 xs:w-56 xs:shadow-none xs:z-auto"
  [ngClass]="isOpen() ? 'translate-x-0' : '-translate-x-full xs:translate-x-0'"
>
  <div class="px-4 py-4 border-b border-border flex items-center justify-between">
    <div class="flex items-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-bookmark w-4 h-4 text-foreground"
      >
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
      </svg>
      <span class="text-sm font-semibold tracking-tight">Marks</span>
    </div>
    <button
      type="button"
      class="xs:hidden p-1 rounded-sm text-muted-foreground hover:text-foreground hover:bg-accent cursor-pointer transition-colors"
      (click)="close()"
      aria-label="Close sidebar"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6L6 18"></path>
        <path d="M6 6l12 12"></path>
      </svg>
    </button>
  </div>
  <nav class="flex-1 overflow-y-auto py-4 px-2 flex flex-col gap-5">
    <app-sections></app-sections>
    <app-folders></app-folders>
    <app-tags></app-tags>
  </nav>
  <app-saved></app-saved>
</aside>

<app-create-folder-modal
  [isOpen]="foldersService.isCreateModalOpened()"
  (close)="foldersService.closeCreateModal()"
/>

<app-create-tag-modal
  [isOpen]="tagsService.isCreateModalOpened()"
  (close)="tagsService.closeCreateModal()"
/>
