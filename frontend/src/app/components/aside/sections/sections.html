<div class="flex flex-col gap-0.5">
  <button
    class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-sm text-sm transition-colors text-left cursor-pointer"
    [ngClass]="
      currentSection() === 'all'
        ? 'bg-foreground text-background font-medium'
        : 'text-muted-foreground hover:text-foreground hover:bg-accent'
    "
    (click)="changeSection('all')"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-grid3x3 lucide-grid-3x3 w-3.5 h-3.5 shrink-0"
    >
      <rect width="18" height="18" x="3" y="3" rx="2"></rect>
      <path d="M3 9h18"></path>
      <path d="M3 15h18"></path>
      <path d="M9 3v18"></path>
      <path d="M15 3v18"></path></svg
    ><span>All</span
    ><span class="ml-auto text-xs opacity-50" style="font-family: 'JetBrains Mono', monospace">{{
      allBookmarkCount()
    }}</span></button
  ><button
    class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-sm text-sm transition-colors text-left cursor-pointer"
    [ngClass]="
      currentSection() === 'starred'
        ? 'bg-foreground text-background font-medium'
        : 'text-muted-foreground hover:text-foreground hover:bg-accent'
    "
    (click)="changeSection('starred')"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-star w-3.5 h-3.5 shrink-0"
    >
      <path
        d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"
      ></path></svg
    ><span>Starred</span
    ><span class="ml-auto text-xs opacity-50" style="font-family: 'JetBrains Mono', monospace">{{
      starredBookmarkCount()
    }}</span></button
  ><button
    class="w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-sm text-sm transition-colors text-left cursor-pointer"
    [ngClass]="
      currentSection() === 'readLater'
        ? 'bg-foreground text-background font-medium'
        : 'text-muted-foreground hover:text-foreground hover:bg-accent'
    "
    (click)="changeSection('readLater')"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-clock w-3.5 h-3.5 shrink-0"
    >
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline></svg
    ><span>Read Later</span
    ><span class="ml-auto text-xs opacity-50" style="font-family: 'JetBrains Mono', monospace">{{
      readLaterBookmarkCount()
    }}</span>
  </button>
</div>
