<div bis_skin_checked="1">
  <div class="flex justify-between items-center">
    <p
      class="px-2.5 text-[10px] font-semibold text-muted-foreground uppercase tracking-widest"
      style="font-family: 'JetBrains Mono', monospace"
    >
      Tags
    </p>
    <button
      class="flex items-center gap-1.5 px-1 py-1 bg-primary text-primary-foreground text-sm rounded-sm hover:opacity-90 transition-opacity cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="!isAuthenticated()"
      (click)="openCreateTagModal()"
      title="Create tag"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-plus w-3.5 h-3.5"
      >
        <path d="M5 12h14"></path>
        <path d="M12 5v14"></path>
      </svg>
    </button>
  </div>
  <div class="flex flex-wrap gap-1 px-2 mt-2" bis_skin_checked="1">
    @if (tags().length > 0) {
      @for (tag of tags(); track tag.id) {
        <div
          class="text-[11px] pl-2 pr-1.5 py-0.5 rounded-full border transition-colors border-border flex items-center justify-between gap-1.5"
          style="font-family: 'JetBrains Mono', monospace"
          [ngClass]="
            currentTagId() === tag.id
              ? 'bg-foreground text-background font-medium'
              : 'text-muted-foreground hover:text-foreground hover:bg-accent'
          "
        >
          <button
            type="button"
            class="cursor-pointer truncate"
            (click)="changeCurrentTag(tag.id)"
          >
            {{ tag.title }}
          </button>
          <button
            type="button"
            class="cursor-pointer leading-0 shrink-0 opacity-70 hover:opacity-100 transition-opacity"
            (click)="deleteTag(tag.id)"
            title="Delete tag"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-x w-3 h-3"
            >
              <path d="M18 6L6 18"></path>
              <path d="M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      }
    } @else {
      @if (isLoading()) {
        <p class="text-xs text-muted-foreground mx-1">Loading...</p>
      } @else {
        <p class="text-xs text-muted-foreground mx-1">No tags found</p>
      }
    }
  </div>
</div>
