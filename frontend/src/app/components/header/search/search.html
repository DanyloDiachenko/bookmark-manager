<div class="relative" bis_skin_checked="1">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="lucide lucide-search absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-muted-foreground"
  >
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.3-4.3"></path>
  </svg>
  <input
    type="text"
    placeholder="Search bookmarks..."
    class="w-full pl-9 pr-3 py-1.5 text-sm bg-muted rounded-sm border border-transparent focus:outline-none focus:ring-1 focus:ring-ring placeholder:text-muted-foreground"
    [value]="search()"
    (input)="setSearch($event)"
  />
</div>
