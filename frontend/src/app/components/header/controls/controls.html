<div class="flex items-center gap-2">
  <div
    class="flex items-center border border-border rounded-sm overflow-hidden"
    bis_skin_checked="1"
  >
    <button
      type="button"
      (click)="setViewMode('grid')"
      [class]="
        viewMode() === 'grid'
          ? 'p-1.5 transition-colors bg-foreground text-background cursor-pointer'
          : 'p-1.5 transition-colors text-muted-foreground hover:text-foreground cursor-pointer'
      "
      aria-label="Grid view"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-grid3x3 w-3.5 h-3.5"
      >
        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
        <path d="M3 9h18"></path>
        <path d="M3 15h18"></path>
        <path d="M9 3v18"></path>
        <path d="M15 3v18"></path>
      </svg>
    </button>
    <button
      type="button"
      (click)="setViewMode('list')"
      [class]="
        viewMode() === 'list'
          ? 'p-1.5 transition-colors bg-foreground text-background cursor-pointer'
          : 'p-1.5 transition-colors text-muted-foreground hover:text-foreground cursor-pointer'
      "
      aria-label="List view"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-list w-3.5 h-3.5"
      >
        <path d="M3 12h.01"></path>
        <path d="M3 18h.01"></path>
        <path d="M3 6h.01"></path>
        <path d="M8 12h13"></path>
        <path d="M8 18h13"></path>
        <path d="M8 6h13"></path>
      </svg>
    </button>
  </div>
  <button
    class="flex items-center gap-1.5 px-3 py-1.5 bg-primary text-primary-foreground text-sm rounded-sm hover:opacity-90 transition-opacity cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
    [disabled]="!isAuthenticated()"
    (click)="openCreateBookmarkModal()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-plus w-3.5 h-3.5"
    >
      <path d="M5 12h14"></path>
      <path d="M12 5v14"></path>
    </svg>
    Add
  </button>

  @if (isAuthenticated()) {
    <button
      type="button"
      (click)="logout()"
      class="flex items-center gap-1.5 px-2.5 py-1.5 border border-border text-foreground hover:bg-muted text-sm rounded-sm transition-colors cursor-pointer"
      title="Log out"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-log-out w-3.5 h-3.5"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" x2="9" y1="12" y2="12"></line>
      </svg>
      Logout
    </button>
  } @else {
    <a
      routerLink="/auth"
      class="flex items-center gap-1.5 px-2.5 py-1.5 border border-border text-foreground hover:bg-muted text-sm rounded-sm transition-colors cursor-pointer font-medium"
      title="Log in"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-log-in w-3.5 h-3.5"
      >
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" x2="3" y1="12" y2="12"></line>
      </svg>
      Login
    </a>
  }
</div>

<app-create-bookmark-modal
  [isOpen]="isCreateBookmarkModalOpened()"
  (close)="closeCreateBookmarkModal()"
/>
