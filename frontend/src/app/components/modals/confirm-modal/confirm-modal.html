@if (isOpen()) {
  <div
    class="fixed inset-0 z-[70] bg-black/40 backdrop-blur-[1px] flex items-center justify-center p-4 animate-in fade-in duration-150"
    (click)="onClose()"
  >
    <div
      class="w-full max-w-[400px] bg-card border border-border rounded-lg shadow-2xl overflow-hidden flex flex-col"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between px-6 py-4 border-b border-border/40">
        <h2 class="text-sm font-semibold tracking-tight text-foreground">{{ title() }}</h2>
        <button
          type="button"
          (click)="onClose()"
          class="text-muted-foreground hover:text-foreground transition-colors p-1 rounded-sm cursor-pointer"
          aria-label="Close"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <div class="px-6 py-4 flex flex-col gap-2">
        <p class="text-xs text-muted-foreground leading-relaxed">
          {{ message() }}
        </p>
      </div>
      <div class="flex items-center justify-end gap-3 px-6 py-4 bg-muted/20 border-t border-border/40">
        <button
          type="button"
          (click)="onClose()"
          [disabled]="isSubmitting()"
          class="px-3 py-1.5 text-xs font-medium text-muted-foreground hover:text-foreground hover:bg-muted rounded-sm transition-colors cursor-pointer disabled:opacity-50"
        >
          {{ cancelButtonText() }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="isSubmitting()"
          [class]="
            isDanger()
              ? 'px-4 py-1.5 text-xs font-medium bg-destructive text-destructive-foreground rounded-sm hover:opacity-90 disabled:opacity-50 transition-opacity cursor-pointer shadow-xs'
              : 'px-4 py-1.5 text-xs font-medium bg-primary text-primary-foreground rounded-sm hover:opacity-90 disabled:opacity-50 transition-opacity cursor-pointer shadow-xs'
          "
        >
          @if (isSubmitting()) {
            Processing...
          } @else {
            {{ confirmButtonText() }}
          }
        </button>
      </div>
    </div>
  </div>
}
