@if (isOpen()) {
  <div
    class="fixed inset-0 z-[60] bg-black/40 backdrop-blur-[1px] flex items-center justify-center p-4 animate-in fade-in duration-150"
    (click)="onClose()"
  >
    <div
      class="w-full max-w-[420px] bg-card border border-border rounded-lg shadow-2xl overflow-hidden flex flex-col"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between px-6 py-4 border-b border-border/40">
        <h2 class="text-sm font-semibold tracking-tight text-foreground">Create Tag</h2>
        <button
          type="button"
          (click)="onClose()"
          class="text-muted-foreground hover:text-foreground transition-colors p-1 rounded-sm cursor-pointer"
          aria-label="Close"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
      <form [formGroup]="tagForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 px-6 py-4">
        <div class="flex flex-col gap-1.5">
          <label
            for="tag-title"
            class="text-[10px] tracking-wider uppercase text-muted-foreground"
            style="font-family: 'JetBrains Mono', monospace"
          >
            Title
          </label>
          <input
            id="tag-title"
            type="text"
            formControlName="title"
            placeholder="Tag title..."
            class="w-full px-3 py-2 text-sm bg-muted/40 border border-border rounded-sm focus:outline-none focus:ring-1 focus:ring-ring text-foreground placeholder:text-muted-foreground/60 transition-colors"
          />
          @if (tagForm.controls.title.touched && tagForm.controls.title.hasError('required')) {
            <span class="text-xs text-destructive"> Title is required. </span>
          }
        </div>
        @if (serverError()) {
          <div class="text-xs text-destructive">
            {{ serverError() }}
          </div>
        }
        <div class="flex items-center justify-end gap-3 pt-3 mt-1">
          <button
            type="button"
            (click)="onClose()"
            class="px-3 py-1.5 text-xs font-medium text-muted-foreground hover:text-foreground hover:bg-muted rounded-sm transition-colors cursor-pointer"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="isSubmitting()"
            class="px-4 py-1.5 text-xs font-medium bg-primary text-primary-foreground rounded-sm hover:opacity-90 disabled:opacity-50 transition-opacity cursor-pointer shadow-xs"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
}
