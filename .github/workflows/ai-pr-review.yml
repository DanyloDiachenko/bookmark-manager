name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.AI_PR_REVIEW_KEY }}
        with:
          github-token: ${{ github.token }}

          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commit_id = context.payload.pull_request.head.sha;

            const diffResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number,
              mediaType: {
                format: "diff",
              },
            });

            const diff = diffResponse.data;

            if (!diff || diff.length === 0) {
              console.log("PR diff is empty.");
              return;
            }

            const filesResponse = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const files = filesResponse.data;

            const changedFiles = [];

            for (const file of files) {
              if (file.status === "removed") {
                continue;
              }

              const fileResponse = await github.rest.repos.getContent({
                owner,
                repo,
                path: file.filename,
                ref: commit_id,
              });

              if (Array.isArray(fileResponse.data)) {
                continue;
              }

              const content = Buffer.from(
                fileResponse.data.content,
                "base64"
              ).toString("utf-8");

              changedFiles.push({
                path: file.filename,
                status: file.status,
                content,
                patch: file.patch || "",
              });
            }

            const filesContext = changedFiles
              .map((file) => {
                return [
                  `FILE: ${file.path}`,
                  `STATUS: ${file.status}`,
                  "CONTENT:",
                  file.content,
                  "PATCH:",
                  file.patch,
                  "END FILE",
                ].join("\n");
              })
              .join("\n\n");

            const MAX_CONTEXT_LENGTH = 150000;

            const combinedContext = [
              "PULL REQUEST DIFF:",
              diff,
              "",
              "CHANGED FILES:",
              filesContext,
            ].join("\n");

            if (combinedContext.length > MAX_CONTEXT_LENGTH) {
              console.log(
                `Review context is too large (${combinedContext.length} chars). Skipping AI review.`
              );
              return;
            }

            const systemPrompt = `
              You are a senior Angular code reviewer helping a mid-level developer who is migrating from React and Next.js to Angular.

              The developer already has solid professional experience with React and Next.js but is relatively new to Angular.

              Do not treat React or Next.js patterns as automatically wrong.

              Identify cases where React or Next.js mental models are incorrectly applied to Angular and explain the idiomatic Angular approach.

              Review the pull request using both the PR diff and the full contents of the changed files.

              The diff is the source of truth for what changed.
              The full file contents provide additional context for understanding the changed code.

              Only report issues that are meaningful.

              Prioritize:

              1. Bugs and incorrect behavior
              2. Security issues
              3. Angular architectural problems
              4. Performance problems
              5. Memory leaks
              6. Incorrect RxJS usage
              7. Accessibility issues
              8. Maintainability problems
              9. Important Angular best-practice violations

              Prefer modern Angular patterns when appropriate.

              Consider:

              - standalone components
              - dependency injection
              - inject()
              - signals
              - computed()
              - effect() only when genuinely appropriate
              - @if
              - @for
              - @switch
              - OnPush-friendly patterns
              - async pipe
              - RxJS best practices
              - typed Reactive Forms
              - strong TypeScript typing
              - focused components
              - appropriate services
              - pure transformations
              - accessibility
              - Angular security

              Pay particular attention to React and Next.js migration patterns such as:

              - recreating React state patterns unnecessarily
              - using effects where computed state would be better
              - manually synchronizing derived state
              - treating Angular components like React components
              - unnecessary client-side state
              - unnecessary subscriptions
              - misunderstanding Angular dependency injection
              - misunderstanding Angular change detection
              - recreating React hooks instead of using Angular-native mechanisms
              - unnecessary state management
              - unnecessary memoization
              - unnecessary abstractions copied from React architecture

              Do not report something simply because it differs from React.

              Angular and React have different valid architectural patterns.

              Do not report:

              - harmless formatting
              - subjective preferences
              - minor naming differences
              - personal coding style
              - valid Angular patterns that could simply be implemented differently
              - minor stylistic differences

              The developer is a mid-level engineer.

              Do not explain basic programming concepts.

              For Angular-specific issues, explain briefly what is wrong, why it matters, and what the idiomatic Angular approach would be.

              Prefer incremental practical improvements over large refactors.

              Review only the provided pull request and changed files.

              Do not invent code that does not exist.

              Every review comment must point to an actual changed line in the PR diff.

              The line must be a new file line represented by the diff.

              The side must always be RIGHT.

              Do not comment on unchanged lines.

              If you cannot confidently identify the exact changed line responsible for the issue, do not create a comment.

              Never invent file paths or line numbers.

              Return only valid JSON.

              The response must be an array.

              Each item must have exactly this structure:

              {
                "path": "src/app/example/example.component.ts",
                "line": 42,
                "side": "RIGHT",
                "body": "Explanation of the issue and suggested improvement."
              }

              If there are no meaningful issues, return [].

              Do not return markdown.

              Do not wrap the JSON in code fences.

              Do not return a summary.

              Do not return anything outside the JSON array.
              `;

            const geminiUrl =
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent";

            const geminiResponse = await fetch(
              `${geminiUrl}?key=${process.env.GEMINI_API_KEY}`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  systemInstruction: {
                    parts: [
                      {
                        text: systemPrompt,
                      },
                    ],
                  },
                  contents: [
                    {
                      role: "user",
                      parts: [
                        {
                          text: `Review this pull request using the diff and the full contents of the changed files.\n\n${combinedContext}`,
                        },
                      ],
                    },
                  ],
                  generationConfig: {
                    temperature: 0.1,
                    responseMimeType: "application/json",
                    responseSchema: {
                      type: "ARRAY",
                      items: {
                        type: "OBJECT",
                        properties: {
                          path: {
                            type: "STRING",
                          },
                          line: {
                            type: "INTEGER",
                          },
                          side: {
                            type: "STRING",
                            enum: ["RIGHT"],
                          },
                          body: {
                            type: "STRING",
                          },
                        },
                        required: [
                          "path",
                          "line",
                          "side",
                          "body",
                        ],
                      },
                    },
                  },
                }),
              }
            );

            if (!geminiResponse.ok) {
              const errorText = await geminiResponse.text();

              throw new Error(
                `Gemini API error ${geminiResponse.status}: ${errorText}`
              );
            }

            const geminiResult = await geminiResponse.json();

            const text =
              geminiResult?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!text) {
              console.log("Gemini returned no content.");
              return;
            }

            let comments;

            try {
              comments = JSON.parse(text);
            } catch (error) {
              console.error("Failed to parse Gemini response.");
              console.error(text);
              throw new Error("Gemini returned invalid JSON.");
            }

            if (!Array.isArray(comments)) {
              throw new Error("Gemini response is not an array.");
            }

            const changedLines = new Map();

            for (const file of files) {
              if (!file.patch) {
                continue;
              }

              const validLines = new Set();
              const patchLines = file.patch.split("\n");

              let newLineNumber = null;

              for (const patchLine of patchLines) {
                const hunkMatch = patchLine.match(
                  /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/
                );

                if (hunkMatch) {
                  newLineNumber = Number(hunkMatch[1]);
                  continue;
                }

                if (newLineNumber === null) {
                  continue;
                }

                if (
                  patchLine.startsWith("+") &&
                  !patchLine.startsWith("+++")
                ) {
                  validLines.add(newLineNumber);
                  newLineNumber++;
                  continue;
                }

                if (
                  patchLine.startsWith("-") &&
                  !patchLine.startsWith("---")
                ) {
                  continue;
                }

                newLineNumber++;
              }

              changedLines.set(file.filename, validLines);
            }

            const validComments = comments.filter((comment) => {
              if (!comment) {
                return false;
              }

              if (
                typeof comment.path !== "string" ||
                typeof comment.line !== "number" ||
                typeof comment.body !== "string"
              ) {
                return false;
              }

              if (comment.side !== "RIGHT") {
                return false;
              }

              if (!changedLines.has(comment.path)) {
                return false;
              }

              const lines = changedLines.get(comment.path);

              if (!lines.has(comment.line)) {
                return false;
              }

              if (comment.body.trim().length === 0) {
                return false;
              }

              return true;
            });

            const uniqueComments = [];
            const seen = new Set();

            for (const comment of validComments) {
              const key = `${comment.path}:${comment.line}:${comment.body}`;

              if (seen.has(key)) {
                continue;
              }

              seen.add(key);
              uniqueComments.push(comment);
            }

            console.log(
              `Gemini generated ${comments.length} comments.`
            );

            console.log(
              `${uniqueComments.length} comments passed validation.`
            );

            for (const comment of uniqueComments) {
              try {
                await github.rest.pulls.createReviewComment({
                  owner,
                  repo,
                  pull_number,
                  commit_id,
                  path: comment.path,
                  line: comment.line,
                  side: "RIGHT",
                  body: `🤖 **AI Review**\n\n${comment.body}`,
                });

                console.log(
                  `Created comment: ${comment.path}:${comment.line}`
                );
              } catch (error) {
                console.error(
                  `Failed to create comment ${comment.path}:${comment.line}`
                );
                console.error(error.message);
              }
            }

            console.log("AI review completed.");